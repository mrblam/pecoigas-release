<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Thiết lập style nét viền -->
  <defs>
    <style>
      .stroke-main { stroke: #000000; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .bg-yellow { fill: #F6C828; }
      .bg-cyan { fill: #48C6FE; }
      .bg-white { fill: #FFFFFF; }
      .bg-black { fill: #000000; }
    </style>
  </defs>

  <!-- 3 Chấu cắm / Cực đấu dây ở đáy -->
  <!-- Cụm trái -->
  <line x1="130" y1="465" x2="130" y2="500" class="stroke-main" />
  <line x1="166" y1="465" x2="166" y2="500" class="stroke-main" />
  <rect x="110" y="432" width="76" height="34" class="bg-cyan stroke-main" />

  <!-- Cụm giữa -->
  <line x1="238" y1="465" x2="238" y2="500" class="stroke-main" />
  <line x1="274" y1="465" x2="274" y2="500" class="stroke-main" />
  <rect x="218" y="432" width="76" height="34" class="bg-cyan stroke-main" />

  <!-- Cụm phải -->
  <line x1="346" y1="465" x2="346" y2="500" class="stroke-main" />
  <line x1="382" y1="465" x2="382" y2="500" class="stroke-main" />
  <rect x="326" y="432" width="76" height="34" class="bg-cyan stroke-main" />

  <!-- Khung vỏ tủ màu vàng ngoài cùng -->
  <rect x="74" y="14" width="364" height="420" rx="4" class="bg-yellow stroke-main" />

  <!-- Mặt cánh tủ màu xanh Cyan bên trong -->
  <rect x="132" y="42" width="260" height="364" rx="2" class="bg-cyan stroke-main" />

  <!-- Bảng cảnh báo điện áp cao (Hình vuông vàng) -->
  <rect x="182" y="84" width="186" height="162" class="bg-yellow stroke-main" />

  <!-- Biểu tượng Tia sét (Sấm sét màu đen) -->
  <polygon points="274,110 238,172 270,172 248,220 312,154 280,154" class="bg-black stroke-main" stroke-width="4" />

  <!-- Bản lề cánh tủ bên trái (2 chiếc) -->
  <rect x="108" y="74" width="52" height="102" rx="3" class="bg-white stroke-main" />
  <rect x="108" y="260" width="52" height="102" rx="3" class="bg-white stroke-main" />

  <!-- Công tắc / Cầu dao bên trái -->
  <path d="M 200 296 L 260 296 L 260 328 L 246 328 L 246 358 L 214 358 L 214 328 L 200 328 Z" class="bg-white stroke-main" />

  <!-- Công tắc / Cầu dao bên phải -->
  <path d="M 306 296 L 338 296 L 338 328 L 352 328 L 352 358 L 292 358 L 292 328 L 306 328 Z" class="bg-white stroke-main" />
</svg>
